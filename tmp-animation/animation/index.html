<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Image Reconstruction</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Canvas container for Three.js -->
    <div id="canvas-container"></div>
    
    <!-- Scroll spacer for scrollable content -->
    <div id="scroll-spacer"></div>
    
    <!-- UI overlay -->
    <div id="ui-overlay">
        <h1>Scroll to Reveal</h1>
        <p>Scroll down to watch the particles assemble into the image</p>
        
        <!-- Image Upload -->
        <div id="upload-section">
            <input type="file" id="image-upload" accept="image/*" hidden>
            <button id="upload-btn">
                📷 Choose Your Photo
            </button>
            <p class="upload-hint">or drag & drop an image here</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script type="module" src="src/js/main.js"></script>
</body>
</html>
